[package]
name = "music-terminal-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.29"
grammers-client = "0.10"
grammers-mtsender = "0.10"
grammers-session = "0.10"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-all"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["ogg"] }
symphonia-adapter-libopus = "=0.2.3"
rpassword = "7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_Console", "Win32_System_WinRT"] }
